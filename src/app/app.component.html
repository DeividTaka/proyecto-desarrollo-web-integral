<div style="max-width: 900px; margin: 30px auto; font-family: Arial, sans-serif; padding: 20px;">
  <h1>{{ title }}</h1>
  <hr />

  <!-- Sección 1: Autenticación y Seguridad (Web Service Propio) -->
  <section style="background: #f4f4f9; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
    <h2>1. Módulo de Autenticación Remota (JWT & Seguridad)</h2>
    <p>Prueba con usuario: <strong>admin</strong> | contraseña: <strong>123456</strong></p>
    
    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
      <input type="text" [(ngModel)]="usuario.user" placeholder="Usuario" style="padding: 8px;">
      <input type="password" [(ngModel)]="usuario.pass" placeholder="Contraseña" style="padding: 8px;">
      <button (click)="iniciarSesion()" style="padding: 8px 16px; background: #007bff; color: white; border: none; cursor: pointer;">
        Iniciar Sesión
      </button>
    </div>

    <p *if="mensajeAuth" [style.color]="tokenJwt ? 'green' : 'red'"><strong>{{ mensajeAuth }}</strong></p>
    <div *if="tokenJwt" style="word-break: break-all; background: #e2e2e2; padding: 10px; border-radius: 4px;">
      <small><strong>Token JWT Generado:</strong> {{ tokenJwt }}</small>
    </div>
  </section>

  <!-- Sección 2: Consumo de API de Terceros -->
  <section style="background: #ffffff; border: 1px solid #ddd; padding: 20px; border-radius: 8px;">
    <h2>2. Consumo de Web Service de Terceros (FakeStore API)</h2>
    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;">
      <div *ngFor="let item of productos" style="border: 1px solid #eee; padding: 10px; border-radius: 5px;">
        <img [src]="item.image" [alt]="item.title" style="height: 80px; object-fit: contain; display: block; margin: 0 auto 10px;">
        <h4 style="margin: 5px 0; font-size: 14px;">{{ item.title }}</h4>
        <p style="color: #28a745; font-weight: bold;">${{ item.price }}</p>
      </div>
    </div>
  </section>
</div>
